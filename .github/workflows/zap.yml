```yaml
name: ZAP Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://example.com'
          token: ${{ secrets.GITHUB_TOKEN }}
```
